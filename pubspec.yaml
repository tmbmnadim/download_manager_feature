name: laantech_download_manager
description: "Laantech Download Manager."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  workmanager: ^0.10.10
  go_router: ^18.1.4
  path_provider: ^2.1.6
  dio: ^5.11.1
  fpdart: ^1.2.0
  injectable: ^3.0.0
  get_it: ^9.3.0
